<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>궁합 캐해석 💘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Pretendard', sans-serif; }
  body { background: linear-gradient(160deg,#fff0f6,#f0f4ff); min-height:100vh; padding:20px; color:#2b2b3a; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { text-align:center; font-size:24px; font-weight:800; margin:10px 0 4px; }
  .sub { text-align:center; color:#8a8a9e; font-size:13px; margin-bottom:20px; }
  .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 4px 20px rgba(0,0,0,0.06); margin-bottom:14px; }
  label { font-size:13px; font-weight:700; color:#5b5b72; display:block; margin-bottom:6px; }
  input, textarea { width:100%; border:1.5px solid #eee; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px; outline:none; transition:.15s; }
  input:focus, textarea:focus { border-color:#ff7aa8; }
  textarea { resize:vertical; min-height:44px; }
  button { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#ff7aa8,#7a8bff); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .apikey-box { display:flex; gap:6px; }
  .apikey-box input { margin-bottom:0; }
  .small-btn { width:auto; padding:10px 14px; font-size:12px; border-radius:10px; white-space:nowrap; }
  .result { white-space:pre-wrap; line-height:1.65; font-size:14.5px; }
  .result h2, .result h3 { margin:14px 0 6px; font-size:16px; }
  .loading { text-align:center; padding:30px 0; color:#8a8a9e; font-size:14px; }
  .saved { font-size:11px; color:#5cb85c; margin-top:-6px; margin-bottom:10px; }
  .hint { font-size:11px; color:#aaa; margin-top:-8px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💘 궁합 캐해석</h1>
  <div class="sub">사이다 톤으로 솔직하게 풀어주는 궁합 분석</div>

  <div class="card">
    <label>Google Gemini API 키</label>
    <div class="apikey-box">
      <input id="apiKey" type="password" placeholder="AIza...">
      <button class="small-btn" onclick="saveKey()">저장</button>
    </div>
    <div id="keyStatus" class="hint">이 기기에만 저장되며, 서버로 전송되지 않아요.</div>
  </div>

  <div class="card">
    <label>인물 A 사주 특징</label>
    <textarea id="a" placeholder="예: 비겁다자, 월지 식신"></textarea>
    <label>인물 B 사주 특징</label>
    <textarea id="b" placeholder="예: 관성 강함, 월지 편인"></textarea>
    <label>두 사람의 핵심 관계 요소</label>
    <textarea id="rel" placeholder="예: 서로 자극 주는 관계"></textarea>
    <button id="genBtn" onclick="generate()">🔥 궁합 캐해석 받기</button>
  </div>

  <div id="output"></div>
</div>

<script>
const keyInput = document.getElementById('apiKey');
const status = document.getElementById('keyStatus');
const saved = localStorage.getItem('gemini_api_key');
if (saved) { keyInput.value = saved; status.textContent = '✅ 저장된 키를 불러왔어요.'; status.className='saved'; }

function saveKey(){
  const v = keyInput.value.trim();
  if(!v){ alert('키를 입력해주세요'); return; }
  localStorage.setItem('gemini_api_key', v);
  status.textContent = '✅ 저장 완료! 이 기기에서 계속 유지됩니다.';
  status.className='saved';
}

const PROMPT_TEMPLATE = (a,b,rel) => `
[역할 정의]
너는 두 사람의 사주 데이터를 바탕으로 궁합을 솔직하고 사이다스럽게 분석해 주는 '궁합 캐해석 전문가'야.
너무 격식 차린 딱딱한 말투는 피하고, 친근하면서도 핵심을 찌르는 직설적인 존댓말(사이다 톤)을 사용해 줘.

[말투 및 톤앤매너]
1. 존댓말을 사용하되, 너무 격식 차리지 않고 친구한테 말하듯 솔직하고 직설적인 톤을 유지해.
2. 과도한 인터넷 밈 사용은 자제하고, 깔끔하면서도 재치 있는 비유와 돌직구 멘트를 써.
3. 사주 용어(비겁, 식상, 편관, 월지 등)는 자유롭게 언급해도 돼. 다만, 언급한 뒤에는 "즉, ~한 느낌인 거죠"처럼 요즘 감성에 맞게 어떤 느낌인지 자연스럽게 풀어서 설명해 줘.

[입력 데이터]
- 인물 A 사주 특징: ${a}
- 인물 B 사주 특징: ${b}
- 두 사람의 핵심 관계 요소: ${rel}

[출력 규칙]
반드시 아래 4가지 목차 구조로 작성 (마크다운 헤더 ## 사용):
## 👤 두 사람 캐릭터 한 줄 캐해석
## 💯 궁합 점수 & 사이다 총평
## ⚖️ 찰떡 케미 vs 환장 케미
## 💡 한눈에 보는 관계 요약 & 실전 처방전

각 항목은 3~5문장 내외로 간결하게. 불필요한 서론 없이 바로 본문 시작.
`;

async function generate(){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 입력하고 저장해주세요'); return; }
  const a = document.getElementById('a').value.trim();
  const b = document.getElementById('b').value.trim();
  const rel = document.getElementById('rel').value.trim();
  if(!a || !b){ alert('A, B 사주 특징을 입력해주세요'); return; }

  const btn = document.getElementById('genBtn');
  const out = document.getElementById('output');
  btn.disabled = true;
  out.innerHTML = '<div class="card loading">🔮 사주 풀어보는 중...</div>';

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{ parts: [{ text: PROMPT_TEMPLATE(a,b,rel) }] }]
      })
    });
    const data = await res.json();
    if(data.error){ throw new Error(data.error.message || '요청 실패'); }
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '결과를 받지 못했어요.';
    out.innerHTML = `<div class="card result">${formatText(text)}</div>`;
  }catch(e){
    out.innerHTML = `<div class="card" style="color:#e0507a;">⚠️ 오류: ${e.message}</div>`;
  }finally{
    btn.disabled = false;
  }
}

function formatText(t){
  return t
    .replace(/^## (.*)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}
</script>
</body>
</html>
