<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>궁합 캐해석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html { touch-action:manipulation; }
  body { background:#fafafa; color:#1a1a1a; min-height:100vh; touch-action:manipulation; }
  .wrap { max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  h1 { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  .admin-toggle { font-size:12.5px; font-weight:600; color:#888; background:#fff; border:1px solid #e8e8e8; padding:8px 14px; border-radius:24px; cursor:pointer; transition:.15s; }
  .admin-toggle.on { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }

  .section { display:none; }
  .section.active { display:block; }

  label { font-size:12.5px; font-weight:700; color:#8a8a8a; display:block; margin:14px 0 7px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; border:1.5px solid #ececec; border-radius:12px; padding:12px 13px; font-size:16px; outline:none; background:#fff; color:#1a1a1a; transition:.15s; }
  input:focus, select:focus { border-color:#1a1a1a; }

  .search-box { position:relative; margin-bottom:14px; }
  .search-box input { padding-left:34px; }
  .search-box::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; }

  .person-list { margin-bottom:10px; }
  .person-item { padding:16px 6px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; cursor:pointer; font-size:16px; transition:.1s; gap:10px; }
  .person-item:hover { background:#fafafa; }
  .person-item.selected { background:#f4f4ff; }
  .person-item .name { font-weight:700; font-size:16.5px; }
  .person-item .grp { font-size:13px; color:#aaa; margin-top:3px; }
  .person-item .item-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .empty { text-align:center; padding:28px 0; color:#c2c2c2; font-size:13px; }
  .order-btns { display:flex; flex-direction:column; gap:2px; }
  .order-btns span { font-size:11px; color:#bbb; cursor:pointer; line-height:1; padding:2px; }
  .edit-btn { font-size:13px; color:#5b6bff; cursor:pointer; font-weight:600; }
  .pager { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:16px; }
  .pager button { width:auto; padding:8px 16px; font-size:13px; font-weight:700; border-radius:10px; border:1px solid #e8e8e8; background:#fff; color:#333; cursor:pointer; }
  .pager button:disabled { opacity:.3; cursor:default; }
  .pager .page-info { font-size:13px; color:#888; }

  .picker-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; background:#fff; border:1.5px solid #ececec; border-radius:12px; padding:10px 12px; }
  .picker-row .tag { font-size:11.5px; font-weight:800; color:#fff; background:#999; border-radius:7px; padding:4px 9px; }
  .picker-row .tag.a { background:#ff6f9c; }
  .picker-row .tag.b { background:#6f7fff; }
  .picker-row .val { font-size:14.5px; font-weight:700; flex:1; }
  .picker-row .clear { font-size:11.5px; color:#c2c2c2; cursor:pointer; font-weight:600; }

  .apikey-box { display:flex; gap:8px; margin-bottom:4px; }
  .apikey-box input { margin-bottom:0; }
  .small-btn { width:auto; padding:12px 16px; font-size:12.5px; font-weight:700; border-radius:12px; border:none; background:#1a1a1a; color:#fff; cursor:pointer; white-space:nowrap; }
  .hint { font-size:11.5px; color:#c2c2c2; margin-top:6px; }
  .saved { font-size:11.5px; color:#3fb27f; margin-top:6px; font-weight:600; }

  button.main { width:100%; padding:15px; border:none; border-radius:14px; background:#1a1a1a; color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-top:18px; letter-spacing:-0.2px; }
  button.main:disabled { opacity:.35; }
  button.ghost { width:100%; padding:12px; border:1.5px solid #ececec; border-radius:12px; background:#fff; color:#333; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:8px; }

  .card { border:1.5px solid #ececec; background:#fff; border-radius:16px; padding:20px; margin-top:18px; }
  .result { white-space:pre-wrap; line-height:1.95; font-size:16.5px; color:#2a2a2a; }
  .result h3 { font-size:18px; margin:24px 0 10px; letter-spacing:-0.2px; }
  .result h3:first-child { margin-top:0; }
  .loading-page { text-align:center; padding:80px 20px; color:#c2c2c2; font-size:14px; }
  .loading-page #factText { color:#555; font-size:15px; display:block; margin-top:22px; line-height:1.6; padding:0 8px; }
  #includeGongsu { width:15px; height:15px; }
  .back-btn { font-size:13px; font-weight:700; color:#888; background:#fff; border:1px solid #e8e8e8; padding:8px 14px; border-radius:24px; cursor:pointer; margin-bottom:14px; }
  .divider { height:1px; background:#eee; margin:22px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .del-btn { font-size:11.5px; color:#e05070; cursor:pointer; font-weight:600; }
  .time-row { display:flex; align-items:center; gap:8px; }
  .time-row input[type=time] { flex:1; }
  .time-row label.chk { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:#8a8a8a; margin:0; white-space:nowrap; }
  .time-row input[type=checkbox] { width:15px; height:15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💘 궁합 캐해석</h1>
    <button class="admin-toggle" id="adminToggleBtn" onclick="toggleAdmin()">관리자 모드</button>
  </header>

  <!-- 사용자 모드 -->
  <div class="section active" id="userSection">
    <div class="apikey-box">
      <input id="apiKey" type="password" placeholder="Gemini API 키">
      <button class="small-btn" onclick="saveKey()">저장</button>
    </div>
    <div id="keyStatus" class="hint">이 기기에만 저장됩니다.</div>

    <div class="divider"></div>

    <div class="picker-row"><span class="tag a">A</span><span class="val" id="pickA">인물을 선택하세요</span><span class="clear" onclick="clearPick('a')">지우기</span></div>
    <div class="picker-row"><span class="tag b">B</span><span class="val" id="pickB">인물을 선택하세요</span><span class="clear" onclick="clearPick('b')">지우기</span></div>

    <label class="chk" style="margin:10px 2px 0;"><input type="checkbox" id="includeGongsu">🎭 공/수 성향 분석 포함하기</label>

    <button class="main" id="genBtn" onclick="generate()">🔥 궁합 캐해석 받기</button>

    <div class="divider"></div>

    <div class="search-box"><input id="searchUser" placeholder="본명, 예명 또는 그룹명 검색" oninput="userPage=1; renderUserList()"></div>
    <div class="person-list" id="userList"></div>
    <div class="pager" id="userPager"></div>
  </div>

  <!-- 로딩 페이지 -->
  <div class="section" id="loadingSection">
    <div class="loading-page">
      🔮 사주 풀어보는 중...
      <span id="factText"></span>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div class="section" id="resultSection">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div id="resultOutput"></div>
  </div>

  <!-- 관리자 모드 -->
  <div class="section" id="adminSection">
    <label>본명</label>
    <input id="f_name" placeholder="예: 김서준">
    <label>예명 (선택, 목록에 우선 표시)</label>
    <input id="f_nickname" placeholder="예: 서준이">
    <div class="grid2">
      <div>
        <label>성별</label>
        <select id="f_gender"><option>남</option><option>여</option></select>
      </div>
      <div>
        <label>그룹명 (검색용)</label>
        <input id="f_group" placeholder="예: 친구, 회사">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>생년월일</label>
        <input id="f_birth" type="text" inputmode="numeric" placeholder="YYYYMMDD">
      </div>
      <div>
        <label>출생시간</label>
        <div class="time-row">
          <input id="f_time" type="text" inputmode="numeric" placeholder="HH:mm">
          <label class="chk"><input type="checkbox" id="f_time_unknown" onchange="document.getElementById('f_time').disabled=this.checked; if(this.checked) document.getElementById('f_time').value='';">모름</label>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>일간</label>
        <input id="f_ilgan" placeholder="예: 갑목">
      </div>
      <div>
        <label>오행 분포</label>
        <input id="f_ohaeng" placeholder="예: 목화多 금소">
      </div>
    </div>
    <label>신강/신약</label>
    <select id="f_sinkang"><option>신강</option><option>신약</option><option>중화</option></select>
    <label>기타 사주 특징 (선택)</label>
    <input id="f_etc" placeholder="예: 비겁다자, 월지 식신">

    <button class="main" id="submitBtn" onclick="addPerson()">➕ 인물 등록</button>
    <button class="ghost" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">취소</button>

    <div class="divider"></div>
    <div class="search-box"><input id="searchAdmin" placeholder="본명, 예명 또는 그룹명 검색" oninput="adminPage=1; renderAdminList()"></div>
    <div class="person-list" id="adminList"></div>
    <div class="pager" id="adminPager"></div>
  </div>
</div>

<script>
// ---------- 데이터 ----------
let people = JSON.parse(localStorage.getItem('saju_people') || '[]');
let pickedA = null, pickedB = null;
let editingId = null;
const PAGE_SIZE = 30;
let userPage = 1, adminPage = 1;

function displayName(p){ return p.nickname || p.name; }

function savePeople(){ localStorage.setItem('saju_people', JSON.stringify(people)); }

// ---------- 모드 전환 ----------
function toggleAdmin(){
  const admin = document.getElementById('adminSection');
  const user = document.getElementById('userSection');
  const btn = document.getElementById('adminToggleBtn');
  const isAdmin = admin.classList.contains('active');
  admin.classList.toggle('active', !isAdmin);
  user.classList.toggle('active', isAdmin);
  btn.classList.toggle('on', !isAdmin);
  btn.textContent = isAdmin ? '관리자 모드' : '사용자 모드로';
  if(!isAdmin) renderAdminList();
  else renderUserList();
}

// ---------- API 키 ----------
const keyInput = document.getElementById('apiKey');
const status = document.getElementById('keyStatus');
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) { keyInput.value = savedKey; status.textContent='✅ 저장된 키 불러옴'; status.className='saved'; }
function saveKey(){
  const v = keyInput.value.trim();
  if(!v){ alert('키를 입력해주세요'); return; }
  localStorage.setItem('gemini_api_key', v);
  status.textContent = '✅ 저장 완료';
  status.className='saved';
}

// ---------- 인물 등록 (관리자) ----------
function addPerson(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('본명을 입력해주세요'); return; }
  const fields = {
    name,
    nickname: document.getElementById('f_nickname').value.trim(),
    gender: document.getElementById('f_gender').value,
    group: document.getElementById('f_group').value.trim(),
    birth: document.getElementById('f_birth').value,
    time: document.getElementById('f_time_unknown').checked ? '' : document.getElementById('f_time').value,
    timeUnknown: document.getElementById('f_time_unknown').checked,
    ilgan: document.getElementById('f_ilgan').value.trim(),
    ohaeng: document.getElementById('f_ohaeng').value.trim(),
    sinkang: document.getElementById('f_sinkang').value,
    etc: document.getElementById('f_etc').value.trim()
  };
  if(editingId){
    const idx = people.findIndex(p=>p.id===editingId);
    if(idx !== -1) people[idx] = { ...people[idx], ...fields };
    cancelEdit();
  } else {
    people.push({ id: Date.now(), ...fields });
  }
  savePeople();
  ['f_name','f_nickname','f_group','f_birth','f_time','f_ilgan','f_ohaeng','f_etc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_time_unknown').checked = false;
  document.getElementById('f_time').disabled = false;
  renderAdminList();
}

function startEdit(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_nickname').value = p.nickname || '';
  document.getElementById('f_gender').value = p.gender || '남';
  document.getElementById('f_group').value = p.group || '';
  document.getElementById('f_birth').value = p.birth || '';
  document.getElementById('f_time').value = p.time || '';
  document.getElementById('f_time_unknown').checked = !!p.timeUnknown;
  document.getElementById('f_time').disabled = !!p.timeUnknown;
  document.getElementById('f_ilgan').value = p.ilgan || '';
  document.getElementById('f_ohaeng').value = p.ohaeng || '';
  document.getElementById('f_sinkang').value = p.sinkang || '신강';
  document.getElementById('f_etc').value = p.etc || '';
  document.getElementById('submitBtn').textContent = '💾 수정 저장';
  document.getElementById('cancelEditBtn').style.display = 'block';
  window.scrollTo(0,0);
}

function cancelEdit(){
  editingId = null;
  document.getElementById('submitBtn').textContent = '➕ 인물 등록';
  document.getElementById('cancelEditBtn').style.display = 'none';
  ['f_name','f_nickname','f_group','f_birth','f_time','f_ilgan','f_ohaeng','f_etc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_time_unknown').checked = false;
  document.getElementById('f_time').disabled = false;
}

function moveOrder(id, dir){
  const idx = people.findIndex(p=>p.id===id);
  const swapIdx = idx + dir;
  if(idx===-1 || swapIdx<0 || swapIdx>=people.length) return;
  [people[idx], people[swapIdx]] = [people[swapIdx], people[idx]];
  savePeople();
  renderAdminList();
  renderUserList();
}

function deletePerson(id){
  if(!confirm('삭제할까요?')) return;
  people = people.filter(p=>p.id!==id);
  savePeople();
  renderAdminList();
  renderUserList();
}

function filterPeople(query){
  const q = query.trim().toLowerCase();
  if(!q) return people;
  return people.filter(p => p.name.toLowerCase().includes(q) || (p.nickname||'').toLowerCase().includes(q) || (p.group||'').toLowerCase().includes(q));
}

function renderPager(containerId, total, page, onChange){
  const el = document.getElementById(containerId);
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(total <= PAGE_SIZE){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${page<=1?'disabled':''} onclick="${onChange}(${page-1})">이전</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button ${page>=totalPages?'disabled':''} onclick="${onChange}(${page+1})">다음</button>
  `;
}

function goAdminPage(p){ adminPage = p; renderAdminList(); }
function goUserPage(p){ userPage = p; renderUserList(); }

function renderAdminList(){
  const list = filterPeople(document.getElementById('searchAdmin').value);
  const el = document.getElementById('adminList');
  if(list.length===0){ el.innerHTML = '<div class="empty">등록된 인물이 없어요</div>'; document.getElementById('adminPager').innerHTML=''; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(adminPage > totalPages) adminPage = totalPages;
  const pageList = list.slice((adminPage-1)*PAGE_SIZE, adminPage*PAGE_SIZE);
  el.innerHTML = pageList.map(p => `
    <div class="person-item">
      <div class="order-btns"><span onclick="moveOrder(${p.id},-1)">▲</span><span onclick="moveOrder(${p.id},1)">▼</span></div>
      <div style="flex:1;"><div class="name">${displayName(p)}</div><div class="grp">${p.nickname?`본명 ${p.name} · `:''}${p.group||'그룹없음'} · ${p.gender} · ${p.ilgan||'-'}</div></div>
      <div class="item-actions">
        <span class="edit-btn" onclick="startEdit(${p.id})">수정</span>
        <span class="del-btn" onclick="deletePerson(${p.id})">삭제</span>
      </div>
    </div>`).join('');
  renderPager('adminPager', list.length, adminPage, 'goAdminPage');
}

// ---------- 사용자 목록 & 선택 ----------
function renderUserList(){
  const list = filterPeople(document.getElementById('searchUser').value);
  const el = document.getElementById('userList');
  if(list.length===0){ el.innerHTML = '<div class="empty">등록된 인물이 없어요. 관리자 모드에서 먼저 등록해주세요.</div>'; document.getElementById('userPager').innerHTML=''; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(userPage > totalPages) userPage = totalPages;
  const pageList = list.slice((userPage-1)*PAGE_SIZE, userPage*PAGE_SIZE);
  el.innerHTML = pageList.map(p => `
    <div class="person-item ${pickedA?.id===p.id||pickedB?.id===p.id?'selected':''}" onclick='selectPerson(${p.id})'>
      <div><div class="name">${displayName(p)}</div><div class="grp">${p.group||'그룹없음'} · ${p.gender}</div></div>
    </div>`).join('');
  renderPager('userPager', list.length, userPage, 'goUserPage');
}

function selectPerson(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  if(pickedA && pickedA.id===id){ pickedA=null; }
  else if(pickedB && pickedB.id===id){ pickedB=null; }
  else if(!pickedA){ pickedA = p; }
  else if(!pickedB){ pickedB = p; }
  else { pickedA = p; pickedB = null; } // 재선택 시 A부터 갱신
  document.getElementById('pickA').textContent = pickedA ? displayName(pickedA) : '인물을 선택하세요';
  document.getElementById('pickB').textContent = pickedB ? displayName(pickedB) : '인물을 선택하세요';
  renderUserList();
}

function clearPick(which){
  if(which==='a') pickedA=null; else pickedB=null;
  document.getElementById('pickA').textContent = pickedA ? displayName(pickedA) : '인물을 선택하세요';
  document.getElementById('pickB').textContent = pickedB ? displayName(pickedB) : '인물을 선택하세요';
  renderUserList();
}

// ---------- 사주 특징 문자열 변환 (이름은 사용 안 함) ----------
function sajuDesc(p){
  const parts = [];
  if(p.ilgan) parts.push(`일간 ${p.ilgan}`);
  if(p.ohaeng) parts.push(`오행 ${p.ohaeng}`);
  if(p.sinkang) parts.push(p.sinkang);
  if(p.gender) parts.push(`${p.gender}성`);
  if(p.etc) parts.push(p.etc);
  return parts.join(', ');
}

// ---------- 프롬프트 & 생성 ----------
const GONGSU_MARKER = '## 🎭 공수 성향 분석';

const PROMPT_TEMPLATE = (nameA, a, nameB, b, includeGongsu) => `
[역할 정의]
너는 두 사람의 사주 데이터를 바탕으로 궁합을 분석해 주는 캐해석 전문가야.
말투는 존댓말이지만 친구한테 솔직하게 얘기하듯 자연스럽게 써.
사람이 직접 쓴 글처럼 읽혀야 하고, AI가 쓴 티가 나는 딱딱하고 설명적인 문장은 피해.
쉼표와 따옴표를 과하게 쓰지 말고, 문장은 짧게 끊어서 리듬감 있게 이어가.
같은 표현이나 문장 구조를 반복하지 마.

[호칭]
인물은 반드시 실제 이름 그대로 불러. 'A님', 'B님' 같은 표기는 절대 쓰지 마.
- 인물 1 이름: ${nameA}
- 인물 2 이름: ${nameB}

[사주 용어 사용 원칙]
비겁, 식상, 편관, 월지 같은 사주 용어는 꼭 필요할 때만 최소한으로 써.
용어를 쓸 때는 반드시 바로 뒤에 요즘 말로 어떤 느낌인지 짧게 풀어줘.
용어를 나열하거나 남발하지 말고, 캐릭터를 소개하듯 성격과 행동 패턴 위주로 자연스럽게 풀어써.

[분석 태도]
좋은 말만 골라 담거나 돌려 말하지 마.
장점과 단점을 둘 다 직설적으로, 현실적으로 짚어.
근거는 사주 성향에 기반하되, 포장하지 말고 있는 그대로 얘기해.

[입력 데이터]

let factInterval = null;
let lastFact = '';
function pickFact(){
  let f;
  do { f = FUN_FACTS[Math.floor(Math.random()*FUN_FACTS.length)]; } while (f === lastFact && FUN_FACTS.length > 1);
  lastFact = f;
  return f;
}
function startLoadingFacts(){
  document.getElementById('factText').textContent = pickFact();
  const schedule = () => {
    const delay = 3000 + Math.random()*2000;
    factInterval = setTimeout(() => {
      const el = document.getElementById('factText');
      if(el){ el.textContent = pickFact(); schedule(); }
    }, delay);
  };
  schedule();
}
function stopLoadingFacts(){
  if(factInterval){ clearTimeout(factInterval); factInterval = null; }
}

function showView(view){
  ['userSection','loadingSection','resultSection'].forEach(id=>{
    document.getElementById(id).classList.toggle('active', id===view);
  });
}

window.addEventListener('popstate', () => {
  stopLoadingFacts();
  showView('userSection');
});

async function generate(){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 저장해주세요'); return; }
  if(!pickedA || !pickedB){ alert('A, B 두 인물을 모두 선택해주세요'); return; }

  const includeGongsu = document.getElementById('includeGongsu').checked;
  const btn = document.getElementById('genBtn');
  const resultOut = document.getElementById('resultOutput');
  btn.disabled = true;

  showView('loadingSection');
  history.pushState({view:'loading'}, '');
  startLoadingFacts();

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ parts:[{ text: PROMPT_TEMPLATE(pickedA.name, sajuDesc(pickedA), pickedB.name, sajuDesc(pickedB), includeGongsu) }] }] })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || '요청 실패');
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '결과를 받지 못했어요.';
    stopLoadingFacts();
    const gIdx = text.indexOf(GONGSU_MARKER);
    if(gIdx !== -1){
      const main = text.slice(0, gIdx);
      const gongsu = text.slice(gIdx);
      resultOut.innerHTML = `<div class="card result">${formatText(main)}</div><div class="card result">${formatText(gongsu)}</div>`;
    } else {
      resultOut.innerHTML = `<div class="card result">${formatText(text)}</div>`;
    }
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }catch(e){
    stopLoadingFacts();
    resultOut.innerHTML = `<div class="card" style="color:#e0507a;">⚠️ 오류: ${e.message}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }finally{
    btn.disabled = false;
  }
}

function formatText(t){
  return t.replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
}
