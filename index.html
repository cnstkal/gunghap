<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>궁합 캐해석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --panel2:#f2f2f4; --border:#e2e2e6;
    --text:#1b1b1f; --sub:#6f6f78; --accent:#6e6ef0; --accent2:#b0578a;
    --ok:#2e9e63; --bad:#c9483e;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html { touch-action:manipulation; }
  body { background:var(--bg); color:var(--text); min-height:100vh; touch-action:manipulation; }
  .wrap { max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-0.02em; }
  .admin-toggle { font-size:12.5px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--border); padding:8px 14px; border-radius:100px; cursor:pointer; transition:.15s; }
  .admin-toggle.on { background:var(--text); color:var(--bg); border-color:var(--text); }

  body.is-loading header { display:none; }
  body.is-loading .wrap { padding-top:0; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin:0 auto; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .gender-badge { font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 6px; margin-left:6px; }
  .gender-badge.male { background:rgba(110,110,240,.1); color:var(--accent); }
  .gender-badge.female { background:rgba(176,87,138,.1); color:var(--accent2); }

  .mode-tabs { display:grid; grid-template-columns:repeat(auto-fit, minmax(88px,1fr)); gap:8px; margin-bottom:16px; }
  .mode-tab { padding:11px 6px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--sub); font-weight:600; font-size:13.5px; cursor:pointer; }
  .mode-tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
  #randomBtn { margin-top:8px; }

  .section { display:none; }
  .section.active { display:block; }

  label { font-size:12px; font-weight:600; color:var(--sub); display:block; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:16px; outline:none; background:var(--panel2); color:var(--text); transition:.15s; }
  input:focus, select:focus { border-color:var(--accent); }

  .search-box { position:relative; margin-bottom:14px; }
  .search-box input { padding-left:34px; }
  .search-box::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; }

  .person-list { margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .person-item { padding:14px 14px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:12px; background:var(--panel); cursor:pointer; font-size:16px; transition:.12s; gap:10px; }
  .person-item:active { transform:scale(0.98); }
  .person-item.selected { background:rgba(110,110,240,.06); border-color:var(--accent); }
  .person-item .name { font-weight:600; font-size:16px; }
  .person-item .grp { font-size:13px; color:var(--sub); margin-top:3px; }
  .person-item .item-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .person-item .pick-badge { font-size:11.5px; font-weight:700; color:#fff; border-radius:8px; padding:5px 10px; flex-shrink:0; }
  .person-item .pick-badge.a { background:var(--accent2); }
  .person-item .pick-badge.b { background:var(--accent); }
  .person-item .pick-badge.solo { background:var(--accent); }
  .empty { text-align:center; padding:28px 0; color:var(--sub); font-size:13px; }
  .order-btns { display:flex; flex-direction:column; gap:2px; }
  .order-btns span { font-size:11px; color:var(--sub); cursor:pointer; line-height:1; padding:2px; }
  .edit-btn { font-size:13px; color:var(--accent); cursor:pointer; font-weight:600; }
  .pager { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:16px; }
  .pager button { width:auto; padding:8px 16px; font-size:13px; font-weight:600; border-radius:100px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .pager button:disabled { opacity:.3; cursor:default; }
  .pager .page-info { font-size:13px; color:var(--sub); }

  .picker-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .picker-row .tag { font-size:11.5px; font-weight:700; color:#fff; background:var(--sub); border-radius:7px; padding:4px 9px; }
  .picker-row .tag.a { background:var(--accent2); }
  .picker-row .tag.b { background:var(--accent); }
  .picker-row .val { font-size:14.5px; font-weight:600; flex:1; }
  .picker-row .clear { font-size:11.5px; color:var(--sub); cursor:pointer; font-weight:600; }

  .apikey-box { display:flex; gap:8px; margin-bottom:4px; }
  .apikey-box input { margin-bottom:0; }
  .small-btn { width:auto; padding:12px 16px; font-size:12.5px; font-weight:600; border-radius:8px; border:none; background:var(--text); color:var(--bg); cursor:pointer; white-space:nowrap; }
  .hint { font-size:11px; color:var(--sub); margin-top:8px; line-height:1.6; }
  .saved { font-size:11.5px; color:var(--ok); margin-top:6px; font-weight:600; }

  button.main { width:100%; padding:14px; border:none; border-radius:10px; background:var(--text); color:var(--bg); font-weight:700; font-size:15px; cursor:pointer; margin-top:18px; letter-spacing:-0.01em; transition:opacity .15s; }
  button.main:hover { opacity:.85; }
  button.main:disabled { opacity:.35; }
  button.ghost { width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px; }

  .card { border:1px solid var(--border); background:var(--panel); border-radius:14px; padding:24px 22px; margin-top:16px; }
  .card + .card { margin-top:14px; }
  .result { line-height:1.9; font-size:15.5px; color:var(--text); letter-spacing:-0.005em; }
  .result h3 { font-size:16.5px; font-weight:700; margin:26px 0 12px; letter-spacing:-0.01em; color:var(--accent2); padding-bottom:10px; border-bottom:1px solid var(--border); }
  .result h3:first-child { margin-top:0; }
  .result p { margin:0 0 14px; }
  .result p:last-child { margin-bottom:0; }
  .loading-page { text-align:center; padding:20px; color:var(--sub); font-size:14px; min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent2); animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.9);} 50%{opacity:1;transform:scale(1.1);} }
  .loading-page h2 { font-size:16px; font-weight:600; margin:20px 0 4px; color:var(--text); }
  .loading-page p { color:var(--sub); font-size:13px; margin:0; }
  .trivia { margin-top:28px; max-width:320px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:12px; color:var(--sub); line-height:1.6; }
  #includeGongsu { width:15px; height:15px; }
  .back-btn { font-size:13px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--border); padding:8px 14px; border-radius:100px; cursor:pointer; margin-bottom:14px; }
  .divider { height:1px; background:var(--border); margin:22px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .del-btn { font-size:11.5px; color:var(--bad); cursor:pointer; font-weight:600; }
  .time-row { display:flex; align-items:center; gap:8px; }
  .time-row input[type=time] { flex:1; }
  .time-row label.chk { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--sub); margin:0; white-space:nowrap; }
  .time-row input[type=checkbox] { width:15px; height:15px; }
  .notice-box { max-height:168px; overflow-y:auto; border:1px solid var(--border); border-radius:12px; padding:6px 14px; margin-bottom:18px; background:var(--panel2); }
  .notice-item { font-size:13.5px; color:var(--sub); padding:8px 0; border-bottom:1px solid var(--border); }
  .notice-item:last-child { border-bottom:none; }
  .notice-name { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 사주 박사</h1>
    <button class="admin-toggle" id="adminToggleBtn" onclick="toggleAdmin()">관리자 모드</button>
  </header>

  <!-- 사용자 모드 -->
  <div class="section active" id="userSection">
    <div class="apikey-box">
      <input id="apiKey" type="password" placeholder="Gemini API 키">
      <button class="small-btn" onclick="saveKey()">저장</button>
    </div>
    <div id="keyStatus" class="hint">이 기기에만 저장됩니다.</div>

    <div class="divider"></div>

    <div class="mode-tabs">
      <button class="mode-tab" id="tabSolo" onclick="switchMode('solo')">🔮 간단 사주</button>
      <button class="mode-tab active" id="tabCompat" onclick="switchMode('compat')">💯 궁합</button>
      <button class="mode-tab" id="tabSogonghap" onclick="switchMode('sogonghap')">🔥 속궁합</button>
      <button class="mode-tab" id="tabFanfic" onclick="switchMode('fanfic')">📖 팬픽 궁합</button>
    </div>

    <div id="compatControls">
      <div class="picker-row"><span class="tag a">A</span><span class="val" id="pickA">인물을 선택하세요</span><span class="clear" onclick="clearPick('a')">지우기</span></div>
      <div class="picker-row"><span class="tag b">B</span><span class="val" id="pickB">인물을 선택하세요</span><span class="clear" onclick="clearPick('b')">지우기</span></div>

      <label class="chk" style="margin:10px 2px 0;"><input type="checkbox" id="includeGongsu">🎭 공/수 성향 분석 포함하기</label>

      <button class="main" id="genBtn" onclick="generate()">🔥 궁합 캐해석 받기</button>
      <button class="ghost" id="randomBtn" onclick="randomMatch()">🎲 랜덤 궁합</button>
    </div>

    <div id="sogonghapControls" style="display:none;">
      <div class="picker-row"><span class="tag a">A</span><span class="val" id="pickSogoA">인물을 선택하세요</span><span class="clear" onclick="clearPick('sogoA')">지우기</span></div>
      <div class="picker-row"><span class="tag b">B</span><span class="val" id="pickSogoB">인물을 선택하세요</span><span class="clear" onclick="clearPick('sogoB')">지우기</span></div>
      <button class="main" id="sogonghapBtn" onclick="generateSogonghap()">🔥 속궁합 보기</button>
    </div>

    <div id="soloControls" style="display:none;">
      <div class="picker-row"><span class="tag" style="background:var(--accent);">나</span><span class="val" id="pickSolo">인물을 선택하세요</span><span class="clear" onclick="clearPick('solo')">지우기</span></div>
      <button class="main" id="soloBtn" onclick="generateSolo()">🔮 간단 사주 받기</button>
    </div>

    <div id="fanficControls" style="display:none;">
      <div class="picker-row"><span class="tag a">A</span><span class="val" id="pickFanA">인물을 선택하세요</span><span class="clear" onclick="clearPick('fanA')">지우기</span></div>
      <div class="picker-row"><span class="tag b">B</span><span class="val" id="pickFanB">인물을 선택하세요</span><span class="clear" onclick="clearPick('fanB')">지우기</span></div>
      <button class="main" id="fanficBtn" onclick="generateFanfic()">📖 팬픽 궁합 받기</button>
    </div>

    <div class="divider"></div>

    <div class="search-box"><input id="searchUser" placeholder="본명, 예명 또는 그룹명 검색" oninput="userPage=1; renderUserList()"></div>
    <div class="person-list" id="userList"></div>
    <div class="pager" id="userPager"></div>
  </div>

  <!-- 로딩 페이지 -->
  <div class="section" id="loadingSection">
    <div class="loading-page">
      <div class="dot"></div>
      <h2>생성 중...</h2>
      <p>사주를 분석하고 있어요</p>
      <div class="trivia">💡 <span id="factText"></span></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div class="section" id="resultSection">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div id="resultOutput"></div>
  </div>

  <!-- 관리자 모드 -->
  <div class="section" id="adminSection">
    <div class="notice-box" id="newNotice" style="display:none;"></div>
    <label>본명</label>
    <input id="f_name" placeholder="예: 김서준">
    <label>예명 (선택, 목록에 우선 표시)</label>
    <input id="f_nickname" placeholder="예: 서준이">
    <div class="grid2">
      <div>
        <label>성별</label>
        <select id="f_gender"><option>남</option><option>여</option></select>
      </div>
      <div>
        <label>그룹명 (검색용)</label>
        <input id="f_group" placeholder="예: 친구, 회사">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>생년월일</label>
        <input id="f_birth" type="text" inputmode="numeric" placeholder="YYYYMMDD">
      </div>
      <div>
        <label>출생시간</label>
        <div class="time-row">
          <input id="f_time" type="text" inputmode="numeric" placeholder="HH:mm">
          <label class="chk"><input type="checkbox" id="f_time_unknown" onchange="document.getElementById('f_time').disabled=this.checked; if(this.checked) document.getElementById('f_time').value='';">모름</label>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>일간</label>
        <input id="f_ilgan" placeholder="예: 갑목">
      </div>
      <div>
        <label>오행 분포</label>
        <input id="f_ohaeng" placeholder="예: 목화多 금소">
      </div>
    </div>
    <label>신강/신약</label>
    <select id="f_sinkang"><option>신강</option><option>신약</option><option>중화</option></select>
    <label>기타 사주 특징 (선택)</label>
    <input id="f_etc" placeholder="예: 비겁다자, 월지 식신">

    <button class="main" id="submitBtn" onclick="addPerson()">➕ 인물 등록</button>
    <button class="ghost" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">취소</button>

    <div class="divider"></div>
    <div class="search-box"><input id="searchAdmin" placeholder="본명, 예명 또는 그룹명 검색" oninput="adminPage=1; renderAdminList()"></div>
    <div class="person-list" id="adminList"></div>
    <div class="pager" id="adminPager"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ---------- Firebase 설정 (본인 프로젝트 값으로 교체하세요) ----------
const firebaseConfig = {
  apiKey: "AIzaSyBzZGHEHKVGqEJWBs6xwub_JmfFzFuK1Tw",
  authDomain: "timeline-e3034.firebaseapp.com",
  projectId: "timeline-e3034",
  storageBucket: "timeline-e3034.firebasestorage.app",
  messagingSenderId: "419108843143",
  appId: "1:419108843143:web:bce82fe95b088c52441222"
};
let fbDb = null;
try{
  firebase.initializeApp(firebaseConfig);
  fbDb = firebase.firestore();
}catch(e){ console.warn('Firebase 초기화 실패', e); }
const FB_DOC = () => fbDb.collection('saju').doc('people');

async function migrateToFirebase(){
  if(!fbDb){ alert('Firebase 설정이 필요합니다.'); return; }
  try{
    await FB_DOC().set({ data: JSON.stringify(people), updatedAt: Date.now() });
    alert('✅ Firebase로 이전 완료! 이제부터 모든 기기가 Firebase 데이터를 사용합니다.');
  }catch(e){ alert('이전 실패: ' + e.message); }
}

async function loadFromFirebase(){
  if(!fbDb) return;
  try{
    const snap = await FB_DOC().get();
    if(snap.exists){
      people = JSON.parse(snap.data().data || '[]');
      localStorage.setItem('saju_people', JSON.stringify(people));
      if(typeof renderUserList==='function') renderUserList();
      if(typeof renderAdminList==='function') renderAdminList();
    }
  }catch(e){ console.warn('Firebase 로드 실패', e); }
}
loadFromFirebase();

// ---------- 데이터 ----------
let people = JSON.parse(localStorage.getItem('saju_people') || '[]');
let pickedA = null, pickedB = null, pickedSolo = null, pickedFanA = null, pickedFanB = null, pickedSogoA = null, pickedSogoB = null;
let mode = 'compat';
let editingId = null;
const PAGE_SIZE = 20;
let userPage = 1, adminPage = 1;

function displayName(p){ return p.nickname || p.name; }

function switchMode(m){
  mode = m;
  document.getElementById('tabSolo').classList.toggle('active', m==='solo');
  document.getElementById('tabCompat').classList.toggle('active', m==='compat');
  document.getElementById('tabSogonghap').classList.toggle('active', m==='sogonghap');
  document.getElementById('tabFanfic').classList.toggle('active', m==='fanfic');
  document.getElementById('soloControls').style.display = m==='solo' ? 'block' : 'none';
  document.getElementById('compatControls').style.display = m==='compat' ? 'block' : 'none';
  document.getElementById('sogonghapControls').style.display = m==='sogonghap' ? 'block' : 'none';
  document.getElementById('fanficControls').style.display = m==='fanfic' ? 'block' : 'none';
  renderUserList();
}

function savePeople(){
  localStorage.setItem('saju_people', JSON.stringify(people));
  if(fbDb){ FB_DOC().set({ data: JSON.stringify(people), updatedAt: Date.now() }).catch(e=>console.warn(e)); }
}

// ---------- 모드 전환 ----------
function toggleAdmin(){
  const admin = document.getElementById('adminSection');
  const user = document.getElementById('userSection');
  const btn = document.getElementById('adminToggleBtn');
  const isAdmin = admin.classList.contains('active');
  admin.classList.toggle('active', !isAdmin);
  user.classList.toggle('active', isAdmin);
  btn.classList.toggle('on', !isAdmin);
  btn.textContent = isAdmin ? '관리자 모드' : '사용자 모드로';
  if(!isAdmin){ renderAdminList(); renderNewNotice(); }
  else renderUserList();
}

// ---------- 신규 등록 알림 ----------
function renderNewNotice(){
  const el = document.getElementById('newNotice');
  if(!el) return;
  const now = Date.now();
  const FOUR_DAYS = 4*24*60*60*1000;
  const recent = people.filter(p => p.addedAt && (now - p.addedAt) < FOUR_DAYS).sort((a,b)=> b.addedAt - a.addedAt);
  if(recent.length===0){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block';
  el.innerHTML = recent.map(p=>{
    const d = new Date(p.addedAt);
    const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일`;
    const label = p.group || displayName(p);
    return `<div class="notice-item">${dateStr}&nbsp;&nbsp;<span class="notice-name">${label}</span>&nbsp;&nbsp;추가되었습니다.</div>`;
  }).join('');
}

// ---------- API 키 ----------
const keyInput = document.getElementById('apiKey');
const status = document.getElementById('keyStatus');
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) { keyInput.value = savedKey; status.textContent='✅ 저장된 키 불러옴'; status.className='saved'; }
function saveKey(){
  const v = keyInput.value.trim();
  if(!v){ alert('키를 입력해주세요'); return; }
  localStorage.setItem('gemini_api_key', v);
  status.textContent = '✅ 저장 완료';
  status.className='saved';
}

// ---------- 인물 등록 (관리자) ----------
function addPerson(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('본명을 입력해주세요'); return; }
  const fields = {
    name,
    nickname: document.getElementById('f_nickname').value.trim(),
    gender: document.getElementById('f_gender').value,
    group: document.getElementById('f_group').value.trim(),
    birth: document.getElementById('f_birth').value,
    time: document.getElementById('f_time_unknown').checked ? '' : document.getElementById('f_time').value,
    timeUnknown: document.getElementById('f_time_unknown').checked,
    ilgan: document.getElementById('f_ilgan').value.trim(),
    ohaeng: document.getElementById('f_ohaeng').value.trim(),
    sinkang: document.getElementById('f_sinkang').value,
    etc: document.getElementById('f_etc').value.trim()
  };
  if(editingId){
    const idx = people.findIndex(p=>p.id===editingId);
    if(idx !== -1) people[idx] = { ...people[idx], ...fields };
    cancelEdit();
  } else {
    people.push({ id: Date.now(), addedAt: Date.now(), ...fields });
  }
  savePeople();
  ['f_name','f_nickname','f_group','f_birth','f_time','f_ilgan','f_ohaeng','f_etc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_time_unknown').checked = false;
  document.getElementById('f_time').disabled = false;
  renderAdminList();
  renderNewNotice();
}

function startEdit(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_nickname').value = p.nickname || '';
  document.getElementById('f_gender').value = p.gender || '남';
  document.getElementById('f_group').value = p.group || '';
  document.getElementById('f_birth').value = p.birth || '';
  document.getElementById('f_time').value = p.time || '';
  document.getElementById('f_time_unknown').checked = !!p.timeUnknown;
  document.getElementById('f_time').disabled = !!p.timeUnknown;
  document.getElementById('f_ilgan').value = p.ilgan || '';
  document.getElementById('f_ohaeng').value = p.ohaeng || '';
  document.getElementById('f_sinkang').value = p.sinkang || '신강';
  document.getElementById('f_etc').value = p.etc || '';
  document.getElementById('submitBtn').textContent = '💾 수정 저장';
  document.getElementById('cancelEditBtn').style.display = 'block';
  window.scrollTo(0,0);
}

function cancelEdit(){
  editingId = null;
  document.getElementById('submitBtn').textContent = '➕ 인물 등록';
  document.getElementById('cancelEditBtn').style.display = 'none';
  ['f_name','f_nickname','f_group','f_birth','f_time','f_ilgan','f_ohaeng','f_etc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_time_unknown').checked = false;
  document.getElementById('f_time').disabled = false;
}

function moveOrder(id, dir){
  const idx = people.findIndex(p=>p.id===id);
  const swapIdx = idx + dir;
  if(idx===-1 || swapIdx<0 || swapIdx>=people.length) return;
  [people[idx], people[swapIdx]] = [people[swapIdx], people[idx]];
  savePeople();
  renderAdminList();
  renderUserList();
}

function deletePerson(id){
  if(!confirm('삭제할까요?')) return;
  people = people.filter(p=>p.id!==id);
  savePeople();
  renderAdminList();
  renderUserList();
}

function filterPeople(query){
  const q = query.trim().toLowerCase();
  if(!q) return people;
  return people.filter(p => p.name.toLowerCase().includes(q) || (p.nickname||'').toLowerCase().includes(q) || (p.group||'').toLowerCase().includes(q));
}

function renderPager(containerId, total, page, onChange){
  const el = document.getElementById(containerId);
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(total <= PAGE_SIZE){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${page<=1?'disabled':''} onclick="${onChange}(${page-1})">이전</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button ${page>=totalPages?'disabled':''} onclick="${onChange}(${page+1})">다음</button>
  `;
}

function goAdminPage(p){ adminPage = p; renderAdminList(); }
function goUserPage(p){ userPage = p; renderUserList(); }

function renderAdminList(){
  const list = filterPeople(document.getElementById('searchAdmin').value);
  const el = document.getElementById('adminList');
  if(list.length===0){ el.innerHTML = '<div class="empty">등록된 인물이 없어요</div>'; document.getElementById('adminPager').innerHTML=''; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(adminPage > totalPages) adminPage = totalPages;
  const pageList = list.slice((adminPage-1)*PAGE_SIZE, adminPage*PAGE_SIZE);
  el.innerHTML = pageList.map(p => `
    <div class="person-item">
      <div class="order-btns"><span onclick="moveOrder(${p.id},-1)">▲</span><span onclick="moveOrder(${p.id},1)">▼</span></div>
      <div style="flex:1;"><div class="name">${displayName(p)}<span class="gender-badge ${p.gender==='여'?'female':'male'}">${p.gender}</span></div><div class="grp">${p.group||'그룹없음'} · ${p.ilgan||'-'}</div></div>
      <div class="item-actions">
        <span class="edit-btn" onclick="startEdit(${p.id})">수정</span>
        <span class="del-btn" onclick="deletePerson(${p.id})">삭제</span>
      </div>
    </div>`).join('');
  renderPager('adminPager', list.length, adminPage, 'goAdminPage');
}

// ---------- 사용자 목록 & 선택 ----------
function renderUserList(){
  const list = filterPeople(document.getElementById('searchUser').value);
  const el = document.getElementById('userList');
  if(list.length===0){ el.innerHTML = '<div class="empty">등록된 인물이 없어요. 관리자 모드에서 먼저 등록해주세요.</div>'; document.getElementById('userPager').innerHTML=''; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(userPage > totalPages) userPage = totalPages;
  const pageList = list.slice((userPage-1)*PAGE_SIZE, userPage*PAGE_SIZE);
  el.innerHTML = pageList.map(p => {
    let badge = '';
    if(mode==='solo'){
      if(pickedSolo?.id===p.id) badge = `<span class="pick-badge solo">✓ 선택됨</span>`;
    } else if(mode==='compat'){
      if(pickedA?.id===p.id) badge = `<span class="pick-badge a">A</span>`;
      else if(pickedB?.id===p.id) badge = `<span class="pick-badge b">B</span>`;
    } else if(mode==='fanfic'){
      if(pickedFanA?.id===p.id) badge = `<span class="pick-badge a">A</span>`;
      else if(pickedFanB?.id===p.id) badge = `<span class="pick-badge b">B</span>`;
    } else if(mode==='sogonghap'){
      if(pickedSogoA?.id===p.id) badge = `<span class="pick-badge a">A</span>`;
      else if(pickedSogoB?.id===p.id) badge = `<span class="pick-badge b">B</span>`;
    }
    const isSelected = badge !== '';
    return `
    <div class="person-item ${isSelected?'selected':''}" onclick='selectPerson(${p.id})'>
      <div><div class="name">${displayName(p)}<span class="gender-badge ${p.gender==='여'?'female':'male'}">${p.gender}</span></div><div class="grp">${p.group||'그룹없음'}</div></div>
      ${badge}
    </div>`;
  }).join('');
  renderPager('userPager', list.length, userPage, 'goUserPage');
}

function selectPerson(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  if(mode==='solo'){
    pickedSolo = (pickedSolo && pickedSolo.id===id) ? null : p;
    document.getElementById('pickSolo').textContent = pickedSolo ? displayName(pickedSolo) : '인물을 선택하세요';
    renderUserList();
    return;
  }
  if(mode==='fanfic'){
    if(pickedFanA && pickedFanA.id===id){ pickedFanA=null; }
    else if(pickedFanB && pickedFanB.id===id){ pickedFanB=null; }
    else if(!pickedFanA){ pickedFanA = p; }
    else if(!pickedFanB){ pickedFanB = p; }
    else { pickedFanA = p; pickedFanB = null; }
    document.getElementById('pickFanA').textContent = pickedFanA ? displayName(pickedFanA) : '인물을 선택하세요';
    document.getElementById('pickFanB').textContent = pickedFanB ? displayName(pickedFanB) : '인물을 선택하세요';
    renderUserList();
    return;
  }
  if(mode==='sogonghap'){
    if(pickedSogoA && pickedSogoA.id===id){ pickedSogoA=null; }
    else if(pickedSogoB && pickedSogoB.id===id){ pickedSogoB=null; }
    else if(!pickedSogoA){ pickedSogoA = p; }
    else if(!pickedSogoB){ pickedSogoB = p; }
    else { pickedSogoA = p; pickedSogoB = null; }
    document.getElementById('pickSogoA').textContent = pickedSogoA ? displayName(pickedSogoA) : '인물을 선택하세요';
    document.getElementById('pickSogoB').textContent = pickedSogoB ? displayName(pickedSogoB) : '인물을 선택하세요';
    renderUserList();
    return;
  }
  if(pickedA && pickedA.id===id){ pickedA=null; }
  else if(pickedB && pickedB.id===id){ pickedB=null; }
  else if(!pickedA){ pickedA = p; }
  else if(!pickedB){ pickedB = p; }
  else { pickedA = p; pickedB = null; } // 재선택 시 A부터 갱신
  document.getElementById('pickA').textContent = pickedA ? displayName(pickedA) : '인물을 선택하세요';
  document.getElementById('pickB').textContent = pickedB ? displayName(pickedB) : '인물을 선택하세요';
  renderUserList();
}

function clearPick(which){
  if(which==='a') pickedA=null;
  else if(which==='b') pickedB=null;
  else if(which==='solo') pickedSolo=null;
  else if(which==='fanA') pickedFanA=null;
  else if(which==='fanB') pickedFanB=null;
  else if(which==='sogoA') pickedSogoA=null;
  else if(which==='sogoB') pickedSogoB=null;
  document.getElementById('pickA').textContent = pickedA ? displayName(pickedA) : '인물을 선택하세요';
  document.getElementById('pickB').textContent = pickedB ? displayName(pickedB) : '인물을 선택하세요';
  document.getElementById('pickSolo').textContent = pickedSolo ? displayName(pickedSolo) : '인물을 선택하세요';
  document.getElementById('pickFanA').textContent = pickedFanA ? displayName(pickedFanA) : '인물을 선택하세요';
  document.getElementById('pickFanB').textContent = pickedFanB ? displayName(pickedFanB) : '인물을 선택하세요';
  document.getElementById('pickSogoA').textContent = pickedSogoA ? displayName(pickedSogoA) : '인물을 선택하세요';
  document.getElementById('pickSogoB').textContent = pickedSogoB ? displayName(pickedSogoB) : '인물을 선택하세요';
  renderUserList();
}

function sajuDesc(p){
  const parts = [];
  if(p.ilgan) parts.push(`일간 ${p.ilgan}`);
  if(p.ohaeng) parts.push(`오행 ${p.ohaeng}`);
  if(p.sinkang) parts.push(p.sinkang);
  if(p.gender) parts.push(`${p.gender}성`);
  if(p.etc) parts.push(p.etc);
  return parts.join(', ');
}

let factInterval = null;
let lastFact = '';
function pickFact(){
  let f;
  do { f = FUN_FACTS[Math.floor(Math.random()*FUN_FACTS.length)]; } while (f === lastFact && FUN_FACTS.length > 1);
  lastFact = f;
  return f;
}
function startLoadingFacts(){
  document.getElementById('factText').textContent = pickFact();
  const schedule = () => {
    const delay = 3000 + Math.random()*2000;
    factInterval = setTimeout(() => {
      const el = document.getElementById('factText');
      if(el){ el.textContent = pickFact(); schedule(); }
    }, delay);
  };
  schedule();
}
function stopLoadingFacts(){
  if(factInterval){ clearTimeout(factInterval); factInterval = null; }
}

function showView(view){
  ['userSection','loadingSection','resultSection'].forEach(id=>{
    document.getElementById(id).classList.toggle('active', id===view);
  });
  document.body.classList.toggle('is-loading', view==='loadingSection');
}

window.addEventListener('popstate', () => {
  stopLoadingFacts();
  showView('userSection');
});

async function callAI(promptText){
  const key = localStorage.getItem('gemini_api_key');
  if(!key) throw new Error('먼저 API 키를 저장해주세요');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{ parts:[{ text: promptText }] }] })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || '요청 실패');
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '결과를 받지 못했어요.';
}

async function generate(forceGongsu){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 저장해주세요'); return; }
  if(!pickedA || !pickedB){ alert('A, B 두 인물을 모두 선택해주세요'); return; }

  const includeGongsu = forceGongsu === true ? true : document.getElementById('includeGongsu').checked;
  const btn = document.getElementById('genBtn');
  const resultOut = document.getElementById('resultOutput');
  btn.disabled = true;

  showView('loadingSection');
  history.pushState({view:'loading'}, '');
  startLoadingFacts();

  const header = `<div class="card" style="padding:14px 18px; font-size:15px; font-weight:700; text-align:center;">${displayName(pickedA)} × ${displayName(pickedB)}</div>`;

  try{
    const text = await callAI(PROMPT_TEMPLATE(displayName(pickedA), pickedA.gender, sajuDesc(pickedA), displayName(pickedB), pickedB.gender, sajuDesc(pickedB), includeGongsu));
    stopLoadingFacts();
    const gIdx = text.indexOf(GONGSU_MARKER);
    if(gIdx !== -1){
      const main = text.slice(0, gIdx);
      const gongsu = text.slice(gIdx);
      resultOut.innerHTML = header + `<div class="card result">${formatText(main)}</div><div class="card result">${formatText(gongsu)}</div>`;
    } else {
      resultOut.innerHTML = header + `<div class="card result">${formatText(text)}</div>`;
    }
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }catch(e){
    stopLoadingFacts();
    resultOut.innerHTML = `<div class="card" style="color:#e0507a;">⚠️ 오류: ${e.message}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }finally{
    btn.disabled = false;
  }
}

function randomMatch(){
  if(people.length < 2){ alert('랜덤 궁합을 실행하려면 등록된 인물이 2명 이상이어야 해요.'); return; }
  const i = Math.floor(Math.random()*people.length);
  let j;
  do { j = Math.floor(Math.random()*people.length); } while(j===i);
  pickedA = people[i];
  pickedB = people[j];
  document.getElementById('pickA').textContent = displayName(pickedA);
  document.getElementById('pickB').textContent = displayName(pickedB);
  renderUserList();
  generate(true);
}

function formatText(t){
  const withBold = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  const blocks = withBold.split(/\n{2,}/);
  return blocks.map(block => {
    const trimmed = block.trim();
    if(!trimmed) return '';
    const headerMatch = trimmed.match(/^## (.*)$/);
    if(headerMatch) return `<h3>${headerMatch[1]}</h3>`;
    return `<p>${trimmed.replace(/\n/g,'<br>')}</p>`;
  }).join('');
}
