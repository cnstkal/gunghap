<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>사주박사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --panel2:#f2f2f4; --border:#e2e2e6;
    --text:#1b1b1f; --sub:#6f6f78; --accent:#6e6ef0; --accent2:#b0578a;
    --ok:#2e9e63; --bad:#c9483e;
  }
  body[data-theme="dark"]{
    --bg:#14141a; --panel:#1d1d24; --panel2:#25252d; --border:#35353f;
    --text:#f1f1f3; --sub:#9c9ca6; --accent:#8f8ff8; --accent2:#d98cb2;
    --ok:#3fbb7a; --bad:#e2685e;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html { touch-action:manipulation; }
  body { background:var(--bg); color:var(--text); min-height:100vh; touch-action:manipulation; }
  .wrap { max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-0.02em; }
  .admin-toggle { font-size:12.5px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--border); padding:8px 14px; border-radius:100px; cursor:pointer; transition:.15s; }
  .admin-toggle.on { background:var(--text); color:var(--bg); border-color:var(--text); }

  body.is-loading header { display:none; }
  body.is-loading .wrap { padding-top:0; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin:0 auto; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .gender-badge { font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 6px; margin-left:6px; }
  .gender-badge.male { background:rgba(110,110,240,.1); color:var(--accent); }
  .gender-badge.female { background:rgba(176,87,138,.1); color:var(--accent2); }
  .gender-group-label { font-size:12.5px; font-weight:700; color:var(--sub); margin:14px 2px 6px; }
  .gender-group-label:first-child { margin-top:2px; }
  .gender-filter-btn { padding:10px 6px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--sub); font-weight:700; font-size:13.5px; cursor:pointer; }
  .gender-filter-btn.active.male { background:var(--accent); color:#fff; border-color:var(--accent); }
  .gender-filter-btn.active.female { background:var(--accent2); color:#fff; border-color:var(--accent2); }

  .mode-tabs { display:grid; grid-template-columns:repeat(auto-fit, minmax(88px,1fr)); gap:8px; margin-bottom:16px; }
  .mode-tab { padding:11px 6px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--sub); font-weight:600; font-size:13.5px; cursor:pointer; }
  .mode-tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
  #randomBtn { margin-top:8px; }

  .section { display:none; }
  .section.active { display:block; }

  label { font-size:12px; font-weight:600; color:var(--sub); display:block; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:16px; outline:none; background:var(--panel2); color:var(--text); transition:.15s; }
  input:focus, select:focus { border-color:var(--accent); }

  .search-box { position:relative; margin-bottom:14px; }
  .search-box input { padding-left:34px; }
  .search-box::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; }

  .person-list { margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .person-item { padding:14px 14px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:12px; background:var(--panel); cursor:pointer; font-size:16px; transition:.12s; gap:10px; }
  .person-item:active { transform:scale(0.98); }
  .person-item.selected { background:rgba(110,110,240,.06); border-color:var(--accent); }
  .person-item .name { font-weight:600; font-size:16px; }
  .person-item .grp { font-size:13px; color:var(--sub); margin-top:3px; }
  .person-item .item-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .person-item .pick-badge { font-size:11.5px; font-weight:700; color:#fff; border-radius:8px; padding:5px 10px; flex-shrink:0; }
  .person-item .pick-badge.a { background:var(--accent2); }
  .person-item .pick-badge.b { background:var(--accent); }
  .person-item .pick-badge.solo { background:var(--accent); }
  .empty { text-align:center; padding:28px 0; color:var(--sub); font-size:13px; }
  .order-btns { display:flex; flex-direction:column; gap:2px; }
  .order-btns span { font-size:11px; color:var(--sub); cursor:pointer; line-height:1; padding:2px; }
  .edit-btn { font-size:13px; color:var(--accent); cursor:pointer; font-weight:600; }
  .pager { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:16px; }
  .pager button { width:auto; padding:8px 16px; font-size:13px; font-weight:600; border-radius:100px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .pager button:disabled { opacity:.3; cursor:default; }
  .pager .page-info { font-size:13px; color:var(--sub); }

  .picker-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .picker-row .tag { font-size:11.5px; font-weight:700; color:#fff; background:var(--sub); border-radius:7px; padding:4px 9px; }
  .picker-row .tag.a { background:var(--accent2); }
  .picker-row .tag.b { background:var(--accent); }
  .picker-row .val { font-size:14.5px; font-weight:600; flex:1; }
  .picker-row .clear { font-size:11.5px; color:var(--sub); cursor:pointer; font-weight:600; }

  .picker-pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .picker-card { position:relative; aspect-ratio:1/1.1; border:1.5px solid var(--border); border-radius:16px; background:var(--panel2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px 10px; transition:.15s; }
  .picker-card.filled { background:var(--panel); border-color:var(--text); }
  .picker-card.filled.a-slot { border-color:var(--accent2); background:rgba(176,87,138,.07); }
  .picker-card.filled.b-slot { border-color:var(--accent); background:rgba(110,110,240,.07); }
  .picker-card .tag { position:absolute; top:10px; left:10px; font-size:11.5px; font-weight:700; color:#fff; border-radius:7px; padding:4px 9px; }
  .picker-card .tag.a { background:var(--accent2); }
  .picker-card .tag.b { background:var(--accent); }
  .picker-card .clear { position:absolute; top:12px; right:12px; color:var(--sub); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .avatar { width:60px; height:60px; border-radius:50%; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:var(--sub); }
  .picker-card .avatar { width:60px; height:60px; border-radius:50%; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:var(--sub); }
  .picker-card.filled .avatar { color:#fff; }
  .picker-card.filled.a-slot .avatar { background:var(--accent2); border-color:var(--accent2); }
  .picker-card.filled.b-slot .avatar { background:var(--accent); border-color:var(--accent); }
  .picker-card .name { font-weight:700; font-size:15px; text-align:center; color:var(--text); word-break:keep-all; }
  .picker-card.filled .name {}
  .picker-card:not(.filled) .name { color:var(--sub); font-weight:600; font-size:13px; }

  .apikey-box { display:flex; gap:8px; margin-bottom:4px; }
  .apikey-box input { margin-bottom:0; }
  .small-btn { width:auto; padding:12px 16px; font-size:12.5px; font-weight:600; border-radius:8px; border:none; background:var(--text); color:var(--bg); cursor:pointer; white-space:nowrap; }
  .hint { font-size:11px; color:var(--sub); margin-top:8px; line-height:1.6; }
  .saved { font-size:11.5px; color:var(--ok); margin-top:6px; font-weight:600; }

  button.main { width:100%; padding:14px; border:none; border-radius:10px; background:var(--text); color:var(--bg); font-weight:700; font-size:15px; cursor:pointer; margin-top:18px; letter-spacing:-0.01em; transition:opacity .15s; }
  button.main:hover { opacity:.85; }
  button.main:disabled { opacity:.35; }
  button.ghost { width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px; }

  .card { border:1px solid var(--border); background:var(--panel); border-radius:14px; padding:28px 24px; margin-top:16px; }
  .card + .card { margin-top:14px; }
  .result { line-height:2.05; font-size:15.5px; color:var(--text); letter-spacing:-0.005em; }
  .result h3 { font-size:16.5px; font-weight:700; margin:36px 0 18px; letter-spacing:-0.01em; color:var(--accent2); padding-bottom:10px; border-bottom:1px solid var(--border); }
  .result h3:first-child { margin-top:0; }
  .result h3.spicy-h { color:var(--bad); margin-top:14px; }
  .result p.spicy-p { background:rgba(201,72,62,.06); border-left:3px solid var(--bad); padding:10px 12px; border-radius:6px; }
  .glossary-body { padding:28px 20px; font-size:14.5px; line-height:1.9; color:var(--text); }
  .glossary-body h4 { font-size:15px; font-weight:700; margin:22px 0 8px; color:var(--accent2); }
  .glossary-body h4:first-child { margin-top:0; }
  .glossary-body p { margin:0 0 12px; }
  .glossary-body b { color:var(--text); }
  .result p { margin:0 0 20px; }
  .result p:last-child { margin-bottom:0; }
  .loading-page { text-align:center; padding:20px; color:var(--sub); font-size:14px; min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent2); animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.9);} 50%{opacity:1;transform:scale(1.1);} }
  .loading-page h2 { font-size:16px; font-weight:600; margin:20px 0 4px; color:var(--text); }
  .loading-page p { color:var(--sub); font-size:13px; margin:0; }
  .trivia { margin-top:28px; max-width:320px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:12px; color:var(--sub); line-height:1.6; }
  #includeGongsu { width:15px; height:15px; }
  .back-btn { font-size:13px; font-weight:600; color:var(--sub); background:var(--panel); border:1px solid var(--border); padding:8px 14px; border-radius:100px; cursor:pointer; margin-bottom:14px; }
  .divider { height:1px; background:var(--border); margin:22px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .del-btn { font-size:11.5px; color:var(--bad); cursor:pointer; font-weight:600; }
  .time-row { display:flex; align-items:center; gap:8px; }

  .util-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
  .util-card { display:flex; align-items:center; gap:10px; padding:13px 12px; border:1px solid var(--border); border-radius:12px; background:var(--panel); cursor:pointer; text-align:left; transition:.15s; }
  .util-card:active { transform:scale(0.98); }
  .util-icon { font-size:20px; flex-shrink:0; }
  .util-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .util-title { font-size:13.5px; font-weight:700; color:var(--text); }
  .util-sub { font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .request-card { padding:30px 24px; }
  .request-head { text-align:center; margin-bottom:22px; }
  .request-emoji { font-size:34px; display:block; margin-bottom:10px; }
  .request-head h2 { font-size:18px; font-weight:700; letter-spacing:-0.02em; margin-bottom:6px; }
  .request-head p { font-size:13px; color:var(--sub); line-height:1.5; }
  .request-card label { margin:16px 0 6px; }
  .request-card label:first-of-type { margin-top:0; }
  .request-card .opt { color:var(--sub); font-weight:500; }
  .request-card textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:15px; outline:none; background:var(--panel2); color:var(--text); resize:vertical; min-height:80px; line-height:1.5; transition:.15s; }
  .request-card textarea:focus { border-color:var(--accent); }
  .time-row input[type=time] { flex:1; }
  .time-row label.chk { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--sub); margin:0; white-space:nowrap; }
  .time-row input[type=checkbox] { width:15px; height:15px; }
  label.chk { display:flex !important; align-items:center; gap:6px; }
  label.chk input[type=checkbox] { width:16px; height:16px; flex:none; }
  .notice-box { max-height:168px; overflow-y:auto; border:1px solid var(--border); border-radius:12px; padding:6px 14px; margin-bottom:18px; background:var(--panel2); }
  .notice-item { font-size:13.5px; color:var(--sub); padding:8px 0; border-bottom:1px solid var(--border); }
  .notice-item:last-child { border-bottom:none; }
  .notice-name { color:var(--accent); font-weight:700; }
  .notice-popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:24px; }
  .notice-popup { background:var(--panel); border-radius:16px; padding:24px 22px; max-width:360px; width:100%; display:flex; flex-direction:column; }
  .notice-popup-title { font-size:16.5px; font-weight:700; margin-bottom:12px; }
  .notice-popup-list { max-height:240px; overflow-y:auto; margin-bottom:16px; }
  .notice-popup-item { padding:10px 2px; border-bottom:1px solid var(--border); }
  .notice-popup-item:last-child { border-bottom:none; }
  .notice-popup-item .date { font-size:12px; color:var(--sub); margin-bottom:3px; }
  .notice-popup-item .msg { font-size:14.5px; color:var(--text); }
  .notice-popup-item .msg .hl { color:var(--accent); font-weight:700; }
  .notice-popup-actions { display:flex; gap:8px; }
  .notice-popup-actions button { margin-top:0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>사주 박사</h1>
    <div style="display:flex; gap:8px;">
      <button class="admin-toggle" id="themeToggleBtn" onclick="toggleTheme()">블랙</button>
    </div>
  </header>

  <!-- 사용자 모드 -->
  <div class="section active" id="userSection">
    <div class="apikey-box">
      <input id="apiKey" type="password" placeholder="Gemini API 키">
      <button class="small-btn" onclick="saveKey()">저장</button>
    </div>
    <div id="keyStatus" class="hint">이 기기에만 저장됩니다. · <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">API Key 무료 발급받는 방법 ↗</a></div>

    <div class="divider"></div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="tabSolo" onclick="switchMode('solo')">간단 사주</button>
      <button class="mode-tab" id="tabCompat" onclick="switchMode('compat')">궁합</button>
      <button class="mode-tab" id="tabGroup" onclick="switchMode('group')">그룹 사주</button>
    </div>

    <div class="util-row">
      <button class="util-card" id="glossaryOpenBtn" onclick="openGlossary()">
        <span class="util-icon">📖</span>
        <span class="util-text"><span class="util-title">용어 가이드</span><span class="util-sub">사주 용어 알아보기</span></span>
      </button>
      <button class="util-card" id="requestOpenBtn" onclick="openRequest()">
        <span class="util-icon">🙋</span>
        <span class="util-text"><span class="util-title">인물 신청</span><span class="util-sub">등록을 요청해보세요</span></span>
      </button>
    </div>
    <div class="divider"></div>

    <div id="compatControls" style="display:none;">
      <button class="admin-toggle" id="compatReversibleBtn" onclick="toggleCompatReversible()" style="margin-bottom:10px;">🔁 리버시블 모드</button>
      <div class="picker-pair">
        <div class="picker-card a-slot" id="pickCardA">
          <span class="tag a" id="compatTagA">공</span>
          <span class="clear" onclick="clearPick('a')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
          <div class="avatar" id="pickAvatarA">＋</div>
          <div class="name" id="pickA">인물을 선택하세요</div>
        </div>
        <div class="picker-card b-slot" id="pickCardB">
          <span class="tag b" id="compatTagB">수</span>
          <span class="clear" onclick="clearPick('b')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
          <div class="avatar" id="pickAvatarB">＋</div>
          <div class="name" id="pickB">인물을 선택하세요</div>
        </div>
      </div>

      <label class="chk" style="margin:10px 2px 0;"><input type="checkbox" id="compatSogonghap">🔥 속궁합 포함하기</label>
      <label class="chk" style="margin:6px 2px 0;"><input type="checkbox" id="compatSpicy">매운맛으로 보기</label>

      <button class="main" id="genBtn" onclick="generate()">궁합 캐해석 받기</button>
      <button class="ghost" id="randomBtn" onclick="randomMatch()">🎲 랜덤 궁합</button>
    </div>

    <div id="soloControls">
      <div class="picker-pair" style="grid-template-columns:1fr;">
        <div class="picker-card" id="pickCardSolo">
          <span class="clear" onclick="clearPick('solo')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
          <div class="avatar" id="pickAvatarSolo">＋</div>
          <div class="name" id="pickSolo">인물을 선택하세요</div>
        </div>
      </div>
      <button class="main" id="soloBtn" onclick="generateSolo()">간단 사주 받기</button>
    </div>

    <div id="groupControls" style="display:none;">
      <div id="groupChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;"></div>
      <div class="hint">최소 2명, 최대 24명까지 목록에서 선택하세요.</div>
      <button class="main" id="groupBtn" onclick="generateGroup()">그룹 사주 분석 받기</button>
    </div>

    <div class="divider"></div>

    <div class="search-box"><input id="searchUser" lang="ko" placeholder="본명, 예명 또는 그룹명 검색" oninput="userPage=1; renderUserList()"></div>
    <div class="gender-filter-row" style="display:flex; gap:8px; margin:8px 0 10px;">
      <button class="gender-filter-btn male active" id="genderFilterMale" onclick="setGenderFilter('남')" style="flex:1;">🙋‍♂️ 남자</button>
      <button class="gender-filter-btn female" id="genderFilterFemale" onclick="setGenderFilter('여')" style="flex:1;">🙋‍♀️ 여자</button>
    </div>
    <div class="person-list" id="userList"></div>
    <div class="pager" id="userPager"></div>
  </div>

  <!-- 로딩 페이지 -->
  <div class="section" id="loadingSection">
    <div class="loading-page">
      <div class="dot"></div>
      <h2>생성 중...</h2>
      <p>사주를 분석하고 있어요</p>
      <div class="trivia">💡 <span id="factText"></span></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div class="section" id="resultSection">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div id="resultOutput"></div>
    <div class="result-share-bar" style="display:flex; gap:8px; margin-top:14px;">
      <button class="ghost" style="flex:1;" onclick="copyResultText()">📋 분석 결과 전체 복사</button>
    </div>
  </div>

  <!-- 사주 용어 가이드 페이지 -->
  <div class="section" id="glossarySection">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div class="card glossary-body" id="glossaryBody"></div>
  </div>

  <div class="section" id="requestSection">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div class="card request-card">
      <div class="request-head">
        <span class="request-emoji">🙋</span>

// ---------- 공지 (관리자 작성 → 사용자 팝업) ----------
const NOTICE_EXPIRE_MS = 4*24*60*60*1000;

function saveNotices(){
  localStorage.setItem('saju_notices', JSON.stringify(notices));
  if(fbDb){ FB_NOTICE_DOC().set({ data: JSON.stringify(notices), updatedAt: Date.now() }).catch(e=>console.warn(e)); }
}

function pruneExpiredNotices(){
  const now = Date.now();
  const before = notices.length;
  notices = notices.filter(n => (now - n.createdAt) < NOTICE_EXPIRE_MS);
  if(notices.length !== before) saveNotices();
}

function formatNoticeDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}


function getTodayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function checkNoticePopup(){
  pruneExpiredNotices();
  if(!notices || notices.length===0) return;
  const sorted = [...notices].sort((a,b)=> b.createdAt - a.createdAt);
  const latest = sorted[0];
  let dismiss = null;
  try{ dismiss = JSON.parse(localStorage.getItem('saju_notice_dismiss') || 'null'); }catch(e){}
  if(dismiss && dismiss.id===latest.id && dismiss.date===getTodayStr()) return;
  window.__currentNoticeId = latest.id;
  document.getElementById('noticePopupList').innerHTML = sorted.map(n => `
    <div class="notice-popup-item">
      <div class="date">${formatNoticeDate(n.createdAt)}</div>
      <div class="msg"><span class="hl">${n.name}</span> 업데이트 완료</div>
    </div>`).join('');
  document.getElementById('noticePopupOverlay').style.display = 'flex';
}

function closeNoticePopup(){
  document.getElementById('noticePopupOverlay').style.display = 'none';
}

function closeNoticeToday(){
  if(window.__currentNoticeId){
    localStorage.setItem('saju_notice_dismiss', JSON.stringify({ id: window.__currentNoticeId, date: getTodayStr() }));
  }
  closeNoticePopup();
}

function filterPeople(query){
  const q = query.trim().toLowerCase();
  let list = !q ? people : people.filter(p => p.name.toLowerCase().includes(q) || (p.nickname||'').toLowerCase().includes(q) || (p.groupEn||'').toLowerCase().includes(q) || (p.groupKo||'').toLowerCase().includes(q));
  return [...list].sort((a,b)=> groupDisplay(a).localeCompare(groupDisplay(b), 'ko') || displayName(a).localeCompare(displayName(b), 'ko'));
}

function renderPager(containerId, total, page, onChange){
  const el = document.getElementById(containerId);
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(total <= PAGE_SIZE){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${page<=1?'disabled':''} onclick="${onChange}(${page-1})">이전</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button ${page>=totalPages?'disabled':''} onclick="${onChange}(${page+1})">다음</button>
  `;
}

function goUserPage(p){ userPage = p; renderUserList(); }


// ---------- 사용자 목록 & 선택 ----------
function personBadge(p){
  let badge = '';
  if(mode==='solo'){
    if(pickedSolo?.id===p.id) badge = `<span class="pick-badge solo">✓ 선택됨</span>`;
  } else if(mode==='compat'){
    if(pickedA?.id===p.id) badge = `<span class="pick-badge a">${compatReversible ? 'A' : '공'}</span>`;
    else if(pickedB?.id===p.id) badge = `<span class="pick-badge b">${compatReversible ? 'B' : '수'}</span>`;
  } else if(mode==='group'){
    const gi = pickedGroup.findIndex(x=>x.id===p.id);
    if(gi!==-1) badge = `<span class="pick-badge solo">✓ ${gi+1}</span>`;
  }
  return badge;
}
function personItemHtml(p){
  const badge = personBadge(p);
  const isSelected = badge !== '';
  return `
    <div class="person-item ${isSelected?'selected':''}" onclick='selectPerson(${p.id})'>
      <div><div class="name">${displayName(p)}<span class="gender-badge ${p.gender==='여'?'female':'male'}">${p.gender}</span></div><div class="grp">${groupDisplay(p)||'그룹없음'}</div></div>
      ${badge}
    </div>`;
}
function setGenderFilter(g){
  genderFilter = g;
  document.getElementById('genderFilterMale').classList.toggle('active', genderFilter==='남');
  document.getElementById('genderFilterFemale').classList.toggle('active', genderFilter==='여');
  userPage = 1;
  renderUserList();
}

function renderUserList(){
  let list = filterPeople(document.getElementById('searchUser').value);
  if(genderFilter) list = list.filter(p=>p.gender===genderFilter);
  const el = document.getElementById('userList');
  if(list.length===0){ el.innerHTML = '<div class="empty">등록된 인물이 없어요. 관리자 모드에서 먼저 등록해주세요.</div>'; document.getElementById('userPager').innerHTML=''; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(userPage > totalPages) userPage = totalPages;
  const pageList = list.slice((userPage-1)*PAGE_SIZE, userPage*PAGE_SIZE);
  el.innerHTML = pageList.map(personItemHtml).join('');
  renderPager('userPager', list.length, userPage, 'goUserPage');
}

function selectPerson(id){
  const p = people.find(x=>x.id===id);
  if(!p) return;
  if(mode==='solo'){
    pickedSolo = (pickedSolo && pickedSolo.id===id) ? null : p;
    updatePickerCard('pickSolo','pickAvatarSolo','pickCardSolo', pickedSolo);
    renderUserList();
    return;
  }
  if(mode==='group'){
    const gi = pickedGroup.findIndex(x=>x.id===id);
    if(gi!==-1) pickedGroup.splice(gi,1);
    else if(pickedGroup.length<24) pickedGroup.push(p);
    else alert('최대 24명까지 선택할 수 있어요.');
    renderGroupChips();
    renderUserList();
    return;
  }
  if(pickedA && pickedA.id===id){ pickedA=null; }
  else if(pickedB && pickedB.id===id){ pickedB=null; }
  else if(!pickedA){ pickedA = p; }
  else if(!pickedB){ pickedB = p; }
  else { pickedA = p; pickedB = null; } // 재선택 시 A부터 갱신
  updatePickerCard('pickA','pickAvatarA','pickCardA', pickedA);
  updatePickerCard('pickB','pickAvatarB','pickCardB', pickedB);
  renderUserList();
}

function clearPick(which){
  if(which==='a') pickedA=null;
  else if(which==='b') pickedB=null;
  else if(which==='solo') pickedSolo=null;
  updatePickerCard('pickA','pickAvatarA','pickCardA', pickedA);
  updatePickerCard('pickB','pickAvatarB','pickCardB', pickedB);
  updatePickerCard('pickSolo','pickAvatarSolo','pickCardSolo', pickedSolo);
  renderUserList();
}

// ---------- 사주 특징 문자열 변환 (이름은 사용 안 함) ----------
// 우선순위: ①사주팔자 ②십성 ③오행 ④신강신약 ⑤용신희신 ⑥격국 ⑦신살(참고)
// 토큰 최소화를 위해 값이 있는 항목만, 짧은 라벨로 이어붙임
function sajuDesc(p){
  const parts = [];
  if(p.saju8) parts.push(`사주 ${p.saju8}`);
  if(p.ilgan) parts.push(`일간 ${p.ilgan}`);
  if(p.sipsung) parts.push(`십성 ${p.sipsung}`);
  if(p.ohaeng) parts.push(`오행 ${p.ohaeng}`);
  if(p.sinkang) parts.push(p.sinkang);
  if(p.yongsin) parts.push(`용신희신 ${p.yongsin}`);
  if(p.gyeokguk) parts.push(`격국 ${p.gyeokguk}`);
  if(p.gender) parts.push(`${p.gender}성`);
  if(p.etc) parts.push(p.etc);
  if(p.sinsal) parts.push(`신살(참고) ${p.sinsal}`);

let factInterval = null;
let lastFact = '';
function pickFact(){
  let f;
  do { f = FUN_FACTS[Math.floor(Math.random()*FUN_FACTS.length)]; } while (f === lastFact && FUN_FACTS.length > 1);
  lastFact = f;
  return f.replace(/^[\p{Extended_Pictographic}\u200d\uFE0F]+\s*/u, '');
}
function startLoadingFacts(){
  document.getElementById('factText').textContent = pickFact();
  const schedule = () => {
    const delay = 3000 + Math.random()*2000;
    factInterval = setTimeout(() => {
      const el = document.getElementById('factText');
      if(el){ el.textContent = pickFact(); schedule(); }
    }, delay);
  };
  schedule();
}
function stopLoadingFacts(){
  if(factInterval){ clearTimeout(factInterval); factInterval = null; }
}

function openGlossary(){
  showView('glossarySection');
  history.pushState({view:'glossary'}, '');
}

function showView(view){
  ['userSection','loadingSection','resultSection','glossarySection','requestSection'].forEach(id=>{
    document.getElementById(id).classList.toggle('active', id===view);
  });
  document.body.classList.toggle('is-loading', view==='loadingSection');
}

window.addEventListener('popstate', () => {
  stopLoadingFacts();
  showView('userSection');
});

async function copyResultText(){
  const el = document.getElementById('resultOutput');
  if(!el || !el.innerText.trim()) return;
  try{
    await navigator.clipboard.writeText(el.innerText.trim());
    alert('결과가 복사되었습니다!');
  }catch(e){
    alert('복사에 실패했습니다. 직접 선택 후 복사해 주세요.');
  }
}

const GEMINI_MODEL = window.GEMINI_MODEL || 'gemini-3-flash-preview';

async function callAI(promptText){
  const key = localStorage.getItem('gemini_api_key');
  if(!key) throw new Error('먼저 API 키를 저장해주세요');

  let res;
  try{
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ parts:[{ text: promptText }] }], generationConfig:{ temperature:0.35, topP:0.85 } })
    });
  }catch(networkErr){
    throw new Error('인터넷 연결을 확인한 후 다시 시도해 주세요.');
  }

  let data;
  try{ data = await res.json(); }
  catch(parseErr){ throw new Error('서버에 일시적인 문제가 발생했습니다.\n잠시 후 다시 이용해 주세요.'); }

  if(data.error){
    const status = data.error.status || '';
    const msg = (data.error.message || '').toLowerCase();
    if(status==='RESOURCE_EXHAUSTED' || res.status===429 || msg.includes('quota') || msg.includes('rate limit')){
      throw new Error('현재 AI 사용량이 초과되었습니다.\n잠시 후 다시 시도해 주세요.');
    }
    if(res.status>=500){
      throw new Error('서버에 일시적인 문제가 발생했습니다.\n잠시 후 다시 이용해 주세요.');
    }
    if(res.status===404 || status==='NOT_FOUND'){
      throw new Error('AI 모델을 찾을 수 없습니다.\n잠시 후 다시 이용해 주세요.');
    }
    if(res.status===400 || res.status===403){
      throw new Error('API 키가 유효하지 않습니다.\n키를 다시 확인해 주세요.');
    }
    throw new Error('현재 AI 서버 사용량이 많아 응답을 생성할 수 없습니다.\n잠시 후 다시 이용해 주세요.');
  }
  if(!res.ok) throw new Error('서버에 일시적인 문제가 발생했습니다.\n잠시 후 다시 이용해 주세요.');

  return data.candidates?.[0]?.content?.parts?.[0]?.text || '결과를 받지 못했어요.';
}

// ---------- 백그라운드 이탈 후 재개 처리 ----------
// 모바일에서 앱을 전환하는 동안 브라우저가 탭을 새로고침(재시작)시키는 경우,
// 진행 중이던 AI 생성 요청을 자동으로 다시 실행해서 끊김을 최소화한다.
function saveGenState(type, data){
  try{ localStorage.setItem('pending_gen', JSON.stringify({ type, data, ts: Date.now() })); }catch(e){}
}
function clearGenState(){
  try{ localStorage.removeItem('pending_gen'); }catch(e){}
}
function resumePendingGeneration(){
  let raw;
  try{ raw = localStorage.getItem('pending_gen'); }catch(e){ return; }
  if(!raw) return;
  let pending;
  try{ pending = JSON.parse(raw); }catch(e){ localStorage.removeItem('pending_gen'); return; }
  localStorage.removeItem('pending_gen');
  if(!pending || !pending.type) return;
  if(Date.now() - (pending.ts || 0) > 5*60*1000) return; // 5분 넘게 지났으면 재개하지 않음
  if(!localStorage.getItem('gemini_api_key')) return;

  const d = pending.data || {};
  const findP = id => people.find(p => p.id === id);

  switch(pending.type){
    case 'couple': {
      pickedA = findP(d.aId); pickedB = findP(d.bId);
      if(pickedA && pickedB){
        compatReversible = !!d.reversible;
        const sogoChk = document.getElementById('compatSogonghap');
        if(sogoChk) sogoChk.checked = !!d.includeSogo;
        const spicyChk = document.getElementById('compatSpicy');
        if(spicyChk) spicyChk.checked = !!d.compatSpicy;
        generate();
      }
      break;
    }
    case 'solo':
      pickedSolo = findP(d.soloId);
      if(pickedSolo) generateSolo();
      break;
    case 'group':
      pickedGroup = (d.ids||[]).map(findP).filter(Boolean);
      if(pickedGroup.length>=2) generateGroup();
      break;
  }
}

async function generate(){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 저장해주세요'); return; }
  if(!pickedA || !pickedB){ alert('A, B 두 인물을 모두 선택해주세요'); return; }

  const includeSogo = document.getElementById('compatSogonghap').checked;
  const compatSpicy = document.getElementById('compatSpicy').checked;
  const btn = document.getElementById('genBtn');
  const resultOut = document.getElementById('resultOutput');
  btn.disabled = true;
  saveGenState('couple', { aId: pickedA.id, bId: pickedB.id, reversible: compatReversible, includeSogo, compatSpicy });

  showView('loadingSection');
  history.pushState({view:'loading'}, '');
  startLoadingFacts();

  const header = `<div class="card" style="padding:14px 18px; font-size:15px; font-weight:700; text-align:center;">${nameGrp(pickedA)} × ${nameGrp(pickedB)}</div>`;

  try{
    const text = await callAI(PROMPT_TEMPLATE(displayName(pickedA), pickedA.gender, sajuDesc(pickedA), displayName(pickedB), pickedB.gender, sajuDesc(pickedB), compatSpicy));
    let sogoHtml = '';
    if(includeSogo){
      const sogoText = await callAI(SOGONGHAP_PROMPT_TEMPLATE(displayName(pickedA), pickedA.gender, sajuDesc(pickedA), displayName(pickedB), pickedB.gender, sajuDesc(pickedB), compatReversible, compatSpicy));
      sogoHtml = `<div class="card result">${formatText(sogoText)}</div>`;
    }
    stopLoadingFacts();
    resultOut.innerHTML = header + `<div class="card result">${formatText(text)}</div>` + sogoHtml;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }catch(e){
    stopLoadingFacts();
    resultOut.innerHTML = `<div class="card" style="color:#e0507a; white-space:pre-line;">⚠️ ${e.message}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }finally{
    clearGenState();
    btn.disabled = false;
  }
}

async function generateSolo(){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 저장해주세요'); return; }
  if(!pickedSolo){ alert('분석할 인물을 선택해주세요'); return; }

  const btn = document.getElementById('soloBtn');
  const resultOut = document.getElementById('resultOutput');
  btn.disabled = true;
  saveGenState('solo', { soloId: pickedSolo.id });

  showView('loadingSection');
  history.pushState({view:'loading'}, '');
  startLoadingFacts();

  const genderClass = pickedSolo.gender==='여' ? 'female' : 'male';
  const soloInitial = displayName(pickedSolo).charAt(0);
  const birthLine = [formatBirth(pickedSolo.birth), (pickedSolo.timeUnknown ? '' : pickedSolo.time)].filter(Boolean).join(' · ');
  const header = `<div class="card" style="text-align:center; padding:28px 22px;">
    <div class="avatar" style="width:60px; height:60px; font-size:24px; margin:0 auto 14px; background:var(--accent); color:#fff; border-color:var(--accent);">${soloInitial}</div>
    <div style="font-size:17px; font-weight:700;">${nameGrp(pickedSolo)}<span class="gender-badge ${genderClass}">${pickedSolo.gender}</span></div>
    ${birthLine ? `<div style="font-size:12.5px; color:var(--sub); margin-top:6px;">${birthLine}</div>` : ''}
  </div>`;

  try{
    const args = [displayName(pickedSolo), pickedSolo.gender, sajuDesc(pickedSolo), pickedSolo.birth, pickedSolo.timeUnknown ? '' : pickedSolo.time];
    const text = await callAI(SOLO_PROMPT_TEMPLATE(...args));
    stopLoadingFacts();
    resultOut.innerHTML = header + `<div class="card result">${formatText(text)}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }catch(e){
    stopLoadingFacts();
    resultOut.innerHTML = `<div class="card" style="color:#e0507a; white-space:pre-line;">⚠️ ${e.message}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }finally{
    clearGenState();
    btn.disabled = false;
  }
}

function renderGroupChips(){
  const el = document.getElementById('groupChips');
  if(!el) return;
  el.innerHTML = pickedGroup.length===0
    ? `<span class="hint">선택된 멤버가 없어요.</span>`
    : pickedGroup.map(p=>`<span class="pick-badge solo" style="cursor:pointer;" onclick="selectPerson(${p.id})">${displayName(p)} ✕</span>`).join('');
}

async function generateGroup(){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){ alert('먼저 API 키를 저장해주세요'); return; }
  if(pickedGroup.length<2){ alert('최소 2명을 선택해주세요'); return; }

  const btn = document.getElementById('groupBtn');
  const resultOut = document.getElementById('resultOutput');
  btn.disabled = true;
  saveGenState('group', { ids: pickedGroup.map(p=>p.id) });

  showView('loadingSection');
  history.pushState({view:'loading'}, '');
  startLoadingFacts();

  const names = pickedGroup.map(p=>nameGrp(p)).join(' · ');
  const header = `<div class="card" style="padding:14px 18px; font-size:15px; font-weight:700; text-align:center;">${names}</div>`;
  const members = pickedGroup.map(p=>({ name: displayName(p), gender: p.gender, desc: sajuDesc(p) }));

  try{
    const text = await callAI(GROUP_PROMPT_TEMPLATE(members));
    stopLoadingFacts();
    resultOut.innerHTML = header + `<div class="card result">${formatText(text)}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }catch(e){
    stopLoadingFacts();
    resultOut.innerHTML = `<div class="card" style="color:#e0507a; white-space:pre-line;">⚠️ ${e.message}</div>`;
    history.replaceState({view:'result'}, '');
    showView('resultSection');
  }finally{
    clearGenState();
    btn.disabled = false;
  }
}

function randomMatch(){
  if(people.length < 2){ alert('랜덤 궁합을 실행하려면 등록된 인물이 2명 이상이어야 해요.'); return; }
  const i = Math.floor(Math.random()*people.length);
  let j;
  do { j = Math.floor(Math.random()*people.length); } while(j===i);
  pickedA = people[i];
  pickedB = people[j];
  updatePickerCard('pickA','pickAvatarA','pickCardA', pickedA);
  updatePickerCard('pickB','pickAvatarB','pickCardB', pickedB);
  renderUserList();
  generate();
}

function splitSections(t){
  let s = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*/g,'');
  const lines = s.split('\n');
  const sections = []; let cur = null;
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const m = line.match(/^#{1,6}\s*(.*)$/);
    if(m){ if(cur) sections.push(cur); cur = { title:m[1], lines:[] }; }
    else if(cur){ cur.lines.push(line.replace(/^\s*[-*>]\s?/, '')); }
  }
  if(cur) sections.push(cur);
  return sections;
}
function mergeDualHtml(normalText, spicyText){
  const n = splitSections(normalText), s = splitSections(spicyText);
  let html = '';
  const len = Math.max(n.length, s.length);
  for(let i=0;i<len;i++){
    if(n[i]) html += `<h3>${n[i].title}</h3><p>${n[i].lines.join('<br>')}</p>`;
    if(s[i]) html += `<h3 class="spicy-h">🌶️ ${s[i].title}</h3><p class="spicy-p">${s[i].lines.join('<br>')}</p>`;
  }
  return html;
}

function formatText(t){
  let s = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.*?)\*/g,'$1');
  s = s.replace(/\*/g,'');

  const lines = s.split('\n');
  let html = '';
  let buf = [];
  const flush = () => {
    if(buf.length){
      html += `<p>${buf.join('<br>')}</p>`;
      buf = [];
    }
  };

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line){ flush(); continue; }
    const headerMatch = line.match(/^#{1,6}\s*(.*)$/);
    if(headerMatch){
      flush();
      html += `<h3>${headerMatch[1]}</h3>`;
    } else {
      buf.push(line.replace(/^\s*[-*>]\s?/, ''));
    }
  }
  flush();
  return html;
}

renderUserList();
resumePendingGeneration();
